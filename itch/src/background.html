<!doctype html>
<!-- itch.io PAGE BACKGROUND — shot at 1920×1080. Kept dark and quiet so the
     content column stays readable. Just the game's base bg + corner glow blobs. -->
<html lang="en"><head><meta charset="utf-8"><style>
  :root{ --bg:#06070b; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:var(--bg);position:relative}
  .blob{position:absolute;border-radius:50%;filter:blur(20px)}
  /* echoes .glow::before / ::after at full-page scale, dialled down for readability */
  .a{width:760px;height:760px;left:-160px;top:-200px;opacity:.30;
     background:radial-gradient(circle at 30% 30%,#cdbcff,transparent 70%)}
  .b{width:720px;height:720px;right:-180px;bottom:-220px;opacity:.28;
     background:radial-gradient(circle at 60% 60%,#a9d6ff,transparent 70%)}
  .c{width:520px;height:520px;left:50%;top:60%;transform:translate(-50%,-50%);opacity:.10;
     background:radial-gradient(circle,#7c5cff,transparent 70%)}
</style></head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
</body></html>
