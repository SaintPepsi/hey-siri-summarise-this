<!doctype html>
<!-- itch.io COVER — shot at 630×500 (itch recommended; min 315×250).
     Palette lifted verbatim from index.html :root (dark theme). -->
<html lang="en"><head><meta charset="utf-8"><style>
  :root{
    --bg:#06070b; --ink:#f5f5f7; --ink-dim:#a1a1a6;
    --blue:#0a84ff; --accent:#9d80ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:630px;height:500px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; text-align:center;
  }
  /* the two corner glow blobs from .glow::before/::after */
  .glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(8px);opacity:.55}
  .glow::before{width:380px;height:380px;left:-90px;top:-110px;background:radial-gradient(circle at 30% 30%,#cdbcff,transparent 70%)}
  .glow::after{width:360px;height:360px;right:-100px;bottom:-120px;background:radial-gradient(circle at 60% 60%,#a9d6ff,transparent 70%)}
  /* Siri orb — conic gradient from .orb */
  .orb{position:relative;width:120px;height:120px;border-radius:50%;
    background:conic-gradient(from 210deg,#16c8ff,#7c5cff,#ff5db0,#16c8ff);
    box-shadow:0 0 50px rgba(124,92,255,.55);margin-bottom:34px;z-index:1}
  .orb::after{content:"";position:absolute;inset:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),transparent 60%)}
  .eyebrow{font-size:15px;font-weight:600;color:var(--ink-dim);letter-spacing:.02em;z-index:1;margin-bottom:10px}
  h1{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.02;z-index:1}
  h1 .spark{color:var(--accent)}
  .sub{font-size:21px;font-weight:800;color:var(--accent);letter-spacing:-.01em;z-index:1;margin-top:6px}
  .tag{margin-top:26px;font-size:16px;color:var(--ink-dim);max-width:46ch;line-height:1.4;z-index:1}
  .tag em{color:var(--blue);font-style:normal;font-weight:600}
</style></head>
<body class="glow">
  <div class="orb"></div>
  <div class="eyebrow">Apple Intelligence™ · summarising for you</div>
  <h1>Hey Siri,<br>Summarise this <span class="spark">✨</span></h1>
  <div class="sub">The Idle Game</div>
  <div class="tag">Siri summarises things you can already see — then summarises the summary. It does <em>not</em> get better.</div>
</body></html>
